services:
  app:
    build: .
    image: hqos-app:latest
    container_name: hqos-app
    ports:
      - "8000:80"
    env_file: .env
    environment:
      APP_URL: http://localhost:8000
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: hospital_queue
      DB_USERNAME: hospital
      DB_PASSWORD: secret
    volumes:
      - storage_data:/var/www/html/storage/app
    depends_on:
      - db

  scheduler:
    image: hqos-app:latest
    container_name: hqos-scheduler
    entrypoint: ["php", "artisan", "schedule:work"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: hospital_queue
      DB_USERNAME: hospital
      DB_PASSWORD: secret
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: hqos-db
    environment:
      MYSQL_DATABASE: hospital_queue
      MYSQL_USER: hospital
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin:5
    container_name: hqos-phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 64M
    depends_on:
      - db

volumes:
  db_data:
  storage_data: